<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellart</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="header">
  <div class="container">
    <h1 class="logo">Bellart</h1>
    <nav class="nav">
      <a href="#servicos">Serviços</a>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
    </nav>
  </div>
</header>
<section class="hero">
  <div class="container">
    <h2>Aplicativo para sua empresa</h2>
    <p>Plataforma simples para iniciar rápido.</p>
    <button id="cta">Falar com a Bellart</button>
  </div>
</section>
<section id="servicos" class="section">
  <div class="container">
    <h3>Serviços</h3>
    <div class="cards">
      <div class="card"><h4>Gestão</h4><p>Operações e processos.</p></div>
      <div class="card"><h4>Vendas</h4><p>Catálogo e pedidos.</p></div>
      <div class="card"><h4>Relatórios</h4><p>Indicadores e insights.</p></div>
    </div>
  </div>
</section>
<section id="sobre" class="section">
  <div class="container">
    <h3>Sobre</h3>
    <p>Somos a Bellart. Este app é o ponto de partida.</p>
  </div>
</section>
<section id="contato" class="section">
  <div class="container">
    <h3>Contato</h3>
    <form id="contatoForm">
      <input type="text" id="nome" placeholder="Seu nome" required>
      <input type="email" id="email" placeholder="Seu e-mail" required>
      <textarea id="mensagem" placeholder="Mensagem" required></textarea>
      <button type="submit">Enviar</button>
    </form>
  </div>
</section>
<footer class="footer">
  <div class="container">
    <small>© Bellart</small>
  </div>
</footer>
<script src="assets/main.js"></script>
</body>
</html>
