services:
  - type: web
    name: bellart-erp
    runtime: python
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py migrate --noinput &&
      python manage.py seed &&
      python manage.py collectstatic --noinput
    startCommand: gunicorn bellart.wsgi --log-file -
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: bellart.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bellart-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: bellart-db
    databaseName: bellart
    user: bellart
