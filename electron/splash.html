<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e1018;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #f0f2f8;
    border-radius: 12px;
    overflow: hidden;
  }

  .logo-text {
    text-align: center;
    margin-bottom: 40px;
  }
  .logo-main {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: #f0f2f8;
  }
  .logo-sub {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: .45em;
    text-transform: uppercase;
    color: #e8a24a;
    margin-top: 4px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(232,162,74,.2);
    border-top-color: #e8a24a;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    font-size: 12px;
    color: #7a82a0;
    letter-spacing: .04em;
  }
</style>
</head>
<body>
  <div class="logo-text">
    <div class="logo-main">Bella Art</div>
    <div class="logo-sub">in madeira</div>
  </div>
  <div class="spinner"></div>
  <div class="status">Iniciando o sistema...</div>
</body>
</html>
